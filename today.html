<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日该学什么 · AI 每日备考计划 · 学士库</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--chsi:#1e4fa3;--ink:#1f2937;--muted:#6b7280;--line:#e3e7ee;--bg:#f2f4f7;--ok:#059669;--bad:#dc2626;--purple:#7c3aed;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.sitehead{background:#fff;border-bottom:1px solid var(--line)}
.sitehead .wrap{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:18px;font-weight:800}
.brand a{color:var(--ink);text-decoration:none}
.brand .en{color:var(--chsi)}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:22px 20px 70px}
.card{background:#fff;border-radius:14px;padding:26px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:22px;margin-bottom:6px}
h2{font-size:17px;margin-bottom:10px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.count-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cs{background:#eef3fb;border:1px solid #d3e0f5;color:var(--chsi);border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:600}
.cs b{font-size:17px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0 20px}
.fg label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.fg select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
.diag-note{background:#faf5ff;border:1px solid #e9d5ff;color:#6b21a8;border-radius:10px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
.diag-note a{color:var(--purple);font-weight:700}
.btn{display:inline-block;background:var(--chsi);color:#fff;border:none;border-radius:10px;padding:13px 34px;font-size:16px;font-weight:600;cursor:pointer}
.btn:disabled{background:#9ca3af;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--chsi);border:1.5px solid var(--chsi)}
.btn.full{width:100%}
.date-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.date-head b{font-size:18px}
.rate{font-size:13px;color:var(--muted)}
.rate b{color:var(--ok)}
.tasks{margin-bottom:14px}
.task{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:.15s}
.task .ck{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.task.done{background:#f0fdf4;border-color:#bbf7d0}
.task.done .ck{background:var(--ok);border-color:var(--ok)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-size:14.5px}
.tt .meta{display:block;font-size:12px;color:var(--purple);margin-top:3px;font-weight:600}
.hist{font-size:13px;color:var(--muted)}
.hist b{color:var(--chsi)}
.hist-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.hist-bar{flex:1;height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.hist-bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.foot-act{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.ai-banner{background:linear-gradient(120deg,#1e4fa3,#7c3aed);color:#fff;border-radius:12px;padding:16px 20px;font-size:13.5px;margin-bottom:16px;line-height:1.6}
.ai-banner b{font-size:15px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="sitehead"><div class="wrap">
<div class="brand"><a href="index.html">学士库<span class="en">xskAi</span></a></div>
<a class="back" href="index.html">← 返回首页</a>
</div></header>

<div class="wrap">

<!-- 无计划：生成表单 -->
<div id="stageSetup" class="card">
<h1>📅 今日该学什么</h1>
<div class="sub">AI 根据考试倒计时、目标分数、每日可用时间（和你的诊断结果）生成今天的具体任务。做完勾选，明天的计划会自动跟着调整。</div>
<div class="count-strip" id="countStrip"></div>
<div id="diagBox"></div>
<div class="form-grid">
<div class="fg"><label>目标分数</label>
<select id="goal"><option value="100">过线够用（100 分）</option><option value="120" selected>主流目标（120 分）</option><option value="140">冲刺高分（140 分）</option></select></div>
<div class="fg"><label>每天可用学习时间</label>
<select id="hours"><option value="1">1 小时（在职/课业重）</option><option value="2" selected>2 小时（标准节奏）</option><option value="3">3 小时（全力备考）</option><option value="4">4 小时以上（冲刺期）</option></select></div>
</div>
<button class="btn full" id="genBtn" onclick="genPlan()">生成今日学习计划 →</button>
<div class="sub" style="margin-top:12px;margin-bottom:0;text-align:center">生成消耗 1 次 AI 额度（免费/卡密均可）</div>
</div>

<!-- 有计划：任务清单 -->
<div id="stagePlan" style="display:none">
<div class="card">
<div class="date-head">
<b>📋 今日计划 · <span id="planDate"></span></b>
<span class="rate">完成 <b id="rateNum">0</b>/<span id="rateAll">0</span></span>
</div>
<div class="tasks" id="taskBox"></div>
<div class="foot-act">
<button class="btn ghost" id="retryBtn" onclick="regenPlan('retry')">重新生成今天</button>
<button class="btn" id="nextBtn" onclick="regenPlan('next')">生成明天的计划 →</button>
</div>
</div>
<div class="card">
<h2>📈 近 7 天完成情况</h2>
<div class="hist" id="histBox">还没有历史记录，今天就是第一天。</div>
</div>
</div>

</div>

<script>
var EXAM = new Date(2026,11,19);
var LS_PLAN = "xsk_plan", LS_HIST = "xsk_plan_hist";
var DEFAULT_WORKER = "https://api.xskai.com/";
function apiBase(){ return localStorage.getItem("xsk_worker") || DEFAULT_WORKER; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function daysLeft(){ return Math.max(0, Math.ceil((EXAM - new Date())/86400000)); }

function renderSetup(){
  var dl = daysLeft();
  document.getElementById("countStrip").innerHTML =
    '<span class="cs">距初试 <b>'+dl+'</b> 天</span><span class="cs">初试 <b>12.19</b>（12月19-20日）</span>';
  var diag = null;
  try{ diag = JSON.parse(localStorage.getItem("xsk_diag")||"null"); }catch(e){}
  var db = document.getElementById("diagBox");
  if(diag && diag.date){
    var weak = diag.weak && diag.weak.length ? diag.weak.join("、") : "无明显薄弱专题";
    db.innerHTML = '<div class="diag-note">📊 检测到你 '+(diag.date)+' 的诊断结果：正确率 <b>'+diag.acc+'%</b>（数'+(diag.track===1?"一":diag.track===2?"二":"三")+'），薄弱点：'+esc(weak)+'。生成计划时会自动纳入。 <a href="diagnose.html">重新诊断 →</a></div>';
  }else{
    db.innerHTML = '<div class="diag-note">💡 还没做过高数水平诊断？<a href="diagnose.html">15 分钟测出薄弱点</a>，计划会更准。不测也可以直接生成。</div>';
  }
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 生成 / 调整计划 ---------- */
function buildPrompt(type, prev){
  var goal = document.getElementById("goal") ? document.getElementById("goal").value : "120";
  var hours = document.getElementById("hours") ? document.getElementById("hours").value : "2";
  var diag = null;
  try{ diag = JSON.parse(localStorage.getItem("xsk_diag")||"null"); }catch(e){}
  var dl = daysLeft();
  var sys = "你是考研数学每日备考计划助手。根据以下信息安排学习任务，要求：\n"+
  "1. 每条任务必须具体可执行：写明时长、内容、题量（如「复习20分钟极限的洛必达使用条件，完成6道计算」），禁止「多练习」「加强理解」这类空话\n"+
  "2. 任务条数：每天可用"+hours+"小时就拆成 3-5 条，总时长不超过可用时间\n"+
  "3. 任务结构：约60%当前阶段重点 + 25%错题/薄弱点回顾 + 15%轻量任务（背诵公式/翻错题本）\n"+
  "4. 输出格式：每行一条任务，行首用「- 」开头，行内以「（X分钟）」标注时长；第一行前加一行「今日主题：xxx」\n"+
  "5. 不要输出其他任何解释文字";
  var ctx = "距初试"+dl+"天；目标分数"+goal+"分；每天可用"+hours+"小时；";
  if(diag && diag.date) ctx += "最近诊断（"+diag.date+"）正确率"+diag.acc+"%，薄弱专题："+((diag.weak&&diag.weak.length)?diag.weak.join("、"):"无")+"；";
  if(type==="next" && prev){
    ctx += "昨天计划"+prev.total+"条完成了"+prev.done+"条"+(prev.unfinished.length?("，未完成："+prev.unfinished.join("；")):"")+"; 今天请优先补上未完成的任务，并适当减量避免堆积";
  }else if(type==="retry"){
    ctx += "这是重新生成今天的计划，请给出与之前不同的安排";
  }
  return {sys:sys, user:"请安排"+(type==="next"?"明天":"今天")+"的学习任务。背景："+ctx};
}
function genPlan(){ callAI(buildPlan("today")); }
function regenPlan(type){
  var p = loadPlan();
  var prev = null;
  if(p && p.tasks){
    var unfinished = [];
    p.tasks.forEach(function(t){ if(!t.done && !/背诵|翻错题/.test(t.text)) unfinished.push(t.text.substring(0,40)); });
    prev = {total:p.tasks.length, done:p.tasks.filter(function(t){return t.done;}).length, unfinished:unfinished};
    saveHist(p);
  }
  callAI(buildPlan(type==="next"?"next":"retry"), type);
}
function buildPlan(type){
  var pr = buildPrompt(type, null);
  if(type==="next"){ var p=loadPlan(); if(p){ var un=[]; p.tasks.forEach(function(t){ if(!t.done && !/背诵|翻错题/.test(t.text)) un.push(t.text.substring(0,40)); }); pr=buildPrompt("next",{total:p.tasks.length,done:p.tasks.filter(function(t){return t.done;}).length,unfinished:un}); } }
  return pr;
}
var planningBusy=false;
function callAI(prompt, type){
  if(planningBusy) return;
  planningBusy=true;
  var btn = document.getElementById("genBtn");
  var btnTxt = btn ? btn.textContent : "";
  if(btn){ btn.disabled=true; btn.textContent="AI 正在规划…（约 20 秒）"; }
  var pbtns = [document.getElementById("retryBtn"), document.getElementById("nextBtn")];
  var pTxt = pbtns.map(function(b){ return b ? b.textContent : ""; });
  pbtns.forEach(function(b){ if(b) b.disabled=true; });
  var active = (type==="next") ? pbtns[1] : pbtns[0];
  if(active) active.textContent="AI 正在规划…（约 20 秒）";
  function restore(){
    planningBusy=false;
    if(btn){ btn.disabled=false; btn.textContent=btnTxt; }
    pbtns.forEach(function(b,i){ if(b){ b.disabled=false; b.textContent=pTxt[i]; } });
  }
  var headers = {"Content-Type":"application/json"};
  var code = localStorage.getItem("xsk_code");
  if(code) headers["X-Access-Code"] = code;
  fetchWorker(apiBase(),{
    method:"POST", headers:headers,
    body:JSON.stringify({messages:[{role:"system",content:prompt.sys},{role:"user",content:prompt.user}],max_tokens:2000})
  }).then(function(r){
    if(r.status===402) throw {msg:"今日免费次数已用完，输入卡密可继续使用（回首页右上角「卡密」输入）"};
    if(r.status===403) throw {msg:"卡密无效或已用完"};
    if(!r.ok) throw {msg:"生成失败（"+r.status+"），请稍后再试"};
    return r.json();
  }).then(function(j){
    var txt = (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
    var theme = "", tasks = [];
    txt.split("\n").forEach(function(line){
      line = line.trim();
      if(!line) return;
      if(/^(今日主题|主题)[:：]/.test(line)){ theme = line.replace(/^(今日主题|主题)[:：]\s*/,""); return; }
      var m = line.match(/^[-•*\d]+[.、)．]?\s*(.+)/);
      if(m) tasks.push(m[1].replace(/\*\*/g,""));
    });
    if(!tasks.length){ tasks = txt.split(/[。；;]/).filter(Boolean).map(function(s){return s.trim();}); }
    var pd = new Date();
    if(type==="next") pd.setDate(pd.getDate()+1);
    var pdStr = pd.getFullYear()+"-"+(pd.getMonth()+1)+"-"+pd.getDate();
    savePlan({date:pdStr, theme:theme, tasks:tasks.map(function(t){return {text:t,done:false};}), goal:document.getElementById("goal")?document.getElementById("goal").value:"120", hours:document.getElementById("hours")?document.getElementById("hours").value:"2"});
    showPlan();
    restore();
  }).catch(function(e){
    alert(e.msg||"网络异常，请重试");
    restore();
  });
}

/* ---------- 计划存取与渲染 ---------- */
function savePlan(p){ localStorage.setItem(LS_PLAN, JSON.stringify(p)); }
function loadPlan(){
  try{ return JSON.parse(localStorage.getItem(LS_PLAN)||"null"); }catch(e){ return null; }
}
function saveHist(p){
  var h = [];
  try{ h = JSON.parse(localStorage.getItem(LS_HIST)||"[]"); }catch(e){}
  var done = p.tasks.filter(function(t){return t.done;}).length;
  h = h.filter(function(x){ return x.date !== p.date; });
  h.push({date:p.date, done:done, total:p.tasks.length});
  h = h.slice(-30);
  localStorage.setItem(LS_HIST, JSON.stringify(h));
}
function showPlan(){
  var p = loadPlan();
  if(!p || p.date !== todayStr()){ 
    var st = document.getElementById("stageSetup"); 
    if(st && p && p.date > todayStr()){
      st.insertAdjacentHTML("afterbegin", '<div class="diag-note" style="background:#f0fdf4;border-color:#bbf7d0;color:#065f46">✅ 明天的计划已备好（主题：'+esc(p.theme||'')+"），明天打开本页自动生效。今天可继续用其他功能。</div>");
    }
    return false; 
  }
  document.getElementById("stageSetup").style.display="none";
  document.getElementById("stagePlan").style.display="";
  document.getElementById("planDate").textContent = p.date + (p.theme ? " · " + p.theme : "");
  renderTasks(); renderHist();
  return true;
}
function renderTasks(){
  var p = loadPlan();
  var box = document.getElementById("taskBox");
  box.innerHTML = "";
  p.tasks.forEach(function(t,i){
    var d = document.createElement("div");
    d.className = "task"+(t.done?" done":"");
    var ck = document.createElement("div");
    ck.className = "ck"; ck.textContent = t.done ? "✓" : "";
    ck.onclick = function(){
      t.done = !t.done;
      savePlan(p);
      renderTasks();
    };
    var tt = document.createElement("div");
    tt.className = "tt";
    var dur = (t.text.match(/（(\d+)\s*分钟）/)||t.text.match(/\((\d+)\s*分钟\)/));
    var main = t.text.replace(/（\d+\s*分钟）/,"").replace(/\(\d+\s*分钟\)/,"").trim();
    tt.innerHTML = esc(main) + (dur ? '<span class="meta">⏱ ' + dur[1] + ' 分钟</span>' : "");
    d.appendChild(ck); d.appendChild(tt);
    box.appendChild(d);
  });
  document.getElementById("rateAll").textContent = p.tasks.length;
  document.getElementById("rateNum").textContent = p.tasks.filter(function(t){return t.done;}).length;
}
function renderHist(){
  var h = [];
  try{ h = JSON.parse(localStorage.getItem(LS_HIST)||"[]"); }catch(e){}
  h = h.filter(function(x){ return x.date !== todayStr(); }).slice(-7);
  var box = document.getElementById("histBox");
  if(!h.length){ box.innerHTML = "还没有历史记录，今天就是第一天。"; return; }
  var html = "";
  h.slice().reverse().forEach(function(x){
    var pct = x.total ? Math.round(x.done/x.total*100) : 0;
    html += '<div class="hist-row"><span style="width:86px">'+x.date+'</span><div class="hist-bar"><i style="width:'+pct+'%"></i></div><b style="width:56px;text-align:right">'+x.done+'/'+x.total+'</b></div>';
  });
  box.innerHTML = html;
}
function fetchWorker(url, opts){
  function once(){
    var ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 45000) : null;
    var o = ctrl ? Object.assign({}, opts, {signal: ctrl.signal}) : opts;
    return fetch(url, o).then(function(r){ clearTimeout(timer); return r; }, function(e){ clearTimeout(timer); throw e; });
  }
  return once().catch(function(e){
    return new Promise(function(res, rej){ setTimeout(function(){ once().then(res, rej); }, 1500); });
  });
}
renderSetup();
if(!showPlan()){ /* 无今日计划，显示生成表单 */ }
window.addEventListener("load",function(){
  if(window.renderMathInElement) renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
});
</script>
</body>
</html>
