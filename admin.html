<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密管理 · XSKAI（站长专用）</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<style>
.toolbox{background:var(--card,#1b2338);border:1px solid #24304a;border-radius:14px;padding:24px;margin:20px 0;max-width:560px}
.toolbox label{display:block;font-size:14px;color:#9fb0cc;margin:14px 0 6px}
.toolbox input,.toolbox select{width:100%;background:#0f1420;border:1px solid #2a3650;border-radius:8px;color:#e8ecf5;padding:10px;font-size:14px;margin:6px 0}
#out{margin-top:16px;padding:16px;background:#0f1420;border:1px solid #2a3650;border-radius:8px;display:none}
#out code{font-size:18px;color:#4ade80;letter-spacing:2px}
.codelist{margin-top:16px;display:none}
.statbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:100px;background:#0f1420;border:1px solid #2a3650;border-radius:8px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:#e8ecf5}
.stat span{font-size:12px;color:#9fb0cc}
.timetab{width:100%;border-collapse:collapse;font-size:13px}
.timetab th{color:#9fb0cc;font-weight:normal;text-align:left;padding:8px 6px;border-bottom:1px solid #2a3650}
.timetab td{padding:8px 6px;border-bottom:1px solid #1c2740;color:#e8ecf5}
.timetab td.code-td{font-family:monospace;letter-spacing:1px;color:#4ade80}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px}
.tag.unused{background:#1e3a5f;color:#7cc4ff}
.tag.active{background:#14532d;color:#4ade80}
.tag.done{background:#451a03;color:#fbbf24}
.empty-tip{color:#9aa5c0;font-size:13px;padding:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <article class="block">
    <h2 class="page-title">🔑 卡密管理</h2>
    <p class="page-desc">站长专用，不对外公开。生成卡密后通过闲鱼私聊发给买家。</p>
    <div class="toolbox">
      <label>Worker 地址</label>
      <input id="wurl" placeholder="https://xskai-api.xxx.workers.dev">
      <label>管理员密码（Worker 里设的 ADMIN_KEY）</label>
      <input id="akey" type="password" placeholder="ADMIN_KEY">
      <label>卡密类型</label>
      <select id="quota">
        <option value="500">次卡 ¥9.9 → 500次</option>
        <option value="1500">月卡 ¥15 → 1500次（约每天50次）</option>
        <option value="100">体验卡 → 100次（送人/测试）</option>
      </select>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn" onclick="gen()">生成卡密</button>
        <button class="btn ghost" onclick="q()">查询已发卡密</button>
      </div>
      <div id="out"></div>
    </div>
    <div class="toolbox codelist" id="codelist">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label style="margin-top:0">卡密使用情况</label>
        <button class="btn ghost sm" onclick="q()">刷新</button>
      </div>
      <div id="sum"></div>
      <div id="tbl"></div>
    </div>
    <p style="color:#9aa5c0;font-size:13px">建议：这个页面不要放进导航和页脚，收藏地址自己用。闲鱼出单后现生成现发，一单一码。</p>
  </article>
</div>
<script src="config.js"></script>
<script>
(function(){ document.getElementById('wurl').value = (typeof SITE_WORKER!=='undefined' ? SITE_WORKER : ''); })();
function copyCode(){
  var t = document.getElementById('newcode').textContent;
  if(navigator.clipboard){ navigator.clipboard.writeText(t); alert('已复制：' + t); }
  else{ prompt('复制卡密：', t); }
}
function fmtTime(ts){
  if(!ts) return '-';
  var d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate();
}
var STATUS = {unused:['unused','未使用'], active:['active','使用中'], done:['done','已用完']};
async function q(){
  var w = document.getElementById('wurl').value.trim().replace(/\/$/,'');
  var k = document.getElementById('akey').value;
  if(!w || !k){ alert('先填 Worker 地址和管理员密码'); return; }
  var box = document.getElementById('codelist');
  box.style.display = 'block';
  document.getElementById('sum').innerHTML = '<div class="empty-tip">查询中…</div>';
  document.getElementById('tbl').innerHTML = '';
  try{
    var r = await fetch(w + '/admin/list', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({admin_key:k})});
    var d = await r.json();
    if(!r.ok){ document.getElementById('sum').innerHTML = '<div class="empty-tip">失败：' + (d.error || r.status) + '</div>'; return; }
    var s = d.summary || {};
    document.getElementById('sum').innerHTML =
      '<div class="statbar">' +
      '<div class="stat"><b>'+ (s.total||0) +'</b><span>全部卡密</span></div>' +
      '<div class="stat"><b>'+ (s.unused||0) +'</b><span>未使用</span></div>' +
      '<div class="stat"><b>'+ (s.active||0) +'</b><span>使用中</span></div>' +
      '<div class="stat"><b>'+ (s.done||0) +'</b><span>已用完</span></div>' +
      '<div class="stat"><b>'+ (s.totalUsed||0) +'</b><span>累计已用次数</span></div>' +
      '</div>';
    if(!d.codes || !d.codes.length){
      document.getElementById('tbl').innerHTML = '<div class="empty-tip">还没有发过卡密</div>';
      return;
    }
    var h = '<table class="timetab"><tr><th>卡密</th><th>已用/总额</th><th>剩余</th><th>状态</th><th>生成时间</th></tr>';
    d.codes.forEach(function(c){
      var st = STATUS[c.status] || ['active','使用中'];
      h += '<tr><td class="code-td">'+c.code+'</td><td>'+c.used+'/'+c.quota+'</td><td>'+c.left+'</td>'+
           '<td><span class="tag '+st[0]+'">'+st[1]+'</span></td><td>'+fmtTime(c.created)+'</td></tr>';
    });
    h += '</table>';
    document.getElementById('tbl').innerHTML = h;
  }catch(e){ document.getElementById('sum').innerHTML = '<div class="empty-tip">失败：' + e.message + '</div>'; }
}
async function gen(){
  var w = document.getElementById('wurl').value.trim().replace(/\/$/,'');
  var k = document.getElementById('akey').value;
  var q = document.getElementById('quota').value;
  if(!w || !k){ alert('先填 Worker 地址和管理员密码'); return; }
  var out = document.getElementById('out');
  out.style.display = 'block'; out.innerHTML = '生成中…';
  try{
    var r = await fetch(w + '/admin/generate', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({admin_key:k, quota:parseInt(q)})});
    var d = await r.json();
    if(!r.ok){ out.innerHTML = '失败：' + (d.error || r.status); return; }
    out.innerHTML = '卡密：<code id="newcode">' + d.code + '</code> <button class="btn ghost sm" onclick="copyCode()">复制</button><br>次数：' + d.quota + ' 次<br><br>复制发给买家即可。';
  }catch(e){ out.innerHTML = '失败：' + e.message; }
}
</script>
</body>
</html>
